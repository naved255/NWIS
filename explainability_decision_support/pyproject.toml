[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nwis-explainability-decision-support"
version = "0.1.0"
description = "SHAP explainability, configurable alerts and evidence-backed recommendations for NWIS"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3", "numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
shap = ["shap>=0.45", "lightgbm>=4.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
