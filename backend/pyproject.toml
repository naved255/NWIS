[project]
name = "nwis-backend-api"
version = "0.1.0"
description = "FastAPI backend API gateway for NWIS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
