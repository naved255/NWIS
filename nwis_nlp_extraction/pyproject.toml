[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nwis-nlp-extraction"
version = "0.1.0"
description = "Contextual NLP information extraction for the NWIS drilling intelligence system"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.7,<3.0"]

[project.optional-dependencies]
nlp = ["spacy>=3.7,<4.0", "transformers>=4.45,<5.0", "torch>=2.2,<3.0"]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
