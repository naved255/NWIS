[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nwis-storage"
version = "0.1.0"
description = "Persistent storage layer for the NWIS project"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["database/tests"]
