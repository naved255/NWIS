services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nwis
      POSTGRES_USER: nwis
      POSTGRES_PASSWORD: nwis
    ports:
      - "5432:5432"
    volumes:
      - nwis_postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - nwis_qdrant:/qdrant/storage

volumes:
  nwis_postgres:
  nwis_qdrant:
